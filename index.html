<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ポケット冒険記</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2d42">
<style>
:root{--body:#2b2d42;--shell:#3d405b;--panel:#fbf8ef;--ink:#1a1a22;--line:#5a5f88;--accent:#e04848}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--body);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#wrap{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:8px 10px;gap:8px}
#screen{position:relative;width:100%;aspect-ratio:3/2;background:#000;border:4px solid #1b1c2b;border-radius:6px;overflow:hidden}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .16s;pointer-events:none}
#place{position:absolute;left:6px;top:6px;padding:4px 10px;background:var(--panel);border:2px solid var(--line);border-radius:4px;font-size:14px;
  opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none}
#place.show{opacity:1;transform:none}
#hud .box{position:absolute;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:3px 7px;font-size:13px;width:47%}
#hud .foe{left:3%;top:5%}
#hud .me{right:3%;top:52%}
#hud .nm{display:flex;gap:4px;align-items:center;font-weight:bold}
#hud .nm span{margin-left:auto;font-weight:normal}
#hud .st{font-size:10px;background:#9b59b6;color:#fff;border-radius:3px;padding:0 3px}
#hud .bar{height:6px;background:#555;border-radius:3px;margin-top:3px;overflow:hidden}
#hud .bar i{display:block;height:100%;transition:width .45s}
#hud .hpn{text-align:right;font-size:12px}
#hud .exp{height:3px;background:#ccc;margin-top:2px}
#hud .exp i{display:block;height:100%;background:#4a90d9;transition:width .45s}
#panel{background:var(--panel);border:3px solid var(--line);border-radius:8px;min-height:116px;padding:8px 12px;font-size:17px;line-height:1.5;position:relative}
#msg{white-space:pre-wrap;min-height:1.5em}
#msg.more::after{content:"▼";color:var(--accent);font-size:12px;margin-left:4px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:0}}
#menu{display:grid;gap:2px 8px;margin-top:4px}
.opt{padding:5px 6px 5px 22px;border-radius:4px;position:relative;cursor:pointer}
.opt.cur{background:#ece4cc}
.opt.cur::before{content:"▶";position:absolute;left:5px;color:var(--accent);font-size:13px;top:7px}
.note{grid-column:1/-1;font-size:14px;color:#555;padding-left:22px}
#pad{flex:1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;min-height:190px;padding-bottom:6px}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);justify-self:start}
#dpad button{background:#20212f;color:#8a8db0;border:none;font-size:20px;touch-action:none}
#dpad [data-d=up]{grid-area:1/2;border-radius:8px 8px 0 0}
#dpad [data-d=left]{grid-area:2/1;border-radius:8px 0 0 8px}
#dpad [data-d=right]{grid-area:2/3;border-radius:0 8px 8px 0}
#dpad [data-d=down]{grid-area:3/2;border-radius:0 0 8px 8px}
#dpad .c{grid-area:2/2;background:#20212f}
#mid{align-self:end;justify-self:center;margin-bottom:22px}
#bStart{background:#5a5f88;color:#e8e8f4;border:none;border-radius:12px;padding:6px 14px;font-size:12px;touch-action:none}
#ab{justify-self:end;position:relative;width:136px;height:126px}
#ab button{position:absolute;width:62px;height:62px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:22px;font-weight:bold;
  box-shadow:0 4px 0 #8e2a2a;touch-action:none}
#bA{right:0;top:10px}
#bB{left:6px;top:56px}
button:active{filter:brightness(1.25)}
#hud{position:absolute;top:0;bottom:0;left:0;width:100%;pointer-events:none}

/* 横持ち：ゲーム画面を全面に、キーと文章は半透明で重ねる */
@media (orientation:landscape){
  html,body{overflow:hidden;background:#000}
  #wrap{max-width:none;padding:0}
  #screen{position:fixed;inset:0;width:auto;aspect-ratio:auto;border:none;border-radius:0}
  #cv{object-fit:contain}
  #place{left:calc(10px + env(safe-area-inset-left))}
  #panel{position:fixed;z-index:5;bottom:calc(6px + env(safe-area-inset-bottom));left:calc(170px + env(safe-area-inset-left));right:calc(160px + env(safe-area-inset-right));
    min-height:0;max-height:52vh;overflow:auto;background:rgba(251,248,239,.9);font-size:16px;padding:6px 12px;border-width:2px}
  #panel:has(#msg:empty):has(#menu:empty){display:none}
  #msg:empty{display:none}
  #menu.short{grid-template-columns:repeat(4,1fr)!important}
  .opt{padding:3px 6px 3px 22px}
  .opt.cur::before{top:4px}
  #pad{position:fixed;inset:0;z-index:4;pointer-events:none;display:block;min-height:0;padding:0}
  #pad button,#dpad{pointer-events:auto}
  #dpad{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));
    grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
  #dpad button,#dpad .c{background:rgba(255,255,255,.16);color:rgba(255,255,255,.75)}
  #mid{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));margin:0}
  #bStart{background:rgba(255,255,255,.18);color:rgba(255,255,255,.85)}
  #ab{position:fixed;right:calc(8px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:136px;height:120px}
  #ab button{background:rgba(224,72,72,.42);box-shadow:none;color:rgba(255,255,255,.9)}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="screen"><canvas id="cv" width="240" height="160"></canvas><div id="hud"></div><div id="place"></div><div id="fade"></div></div>
  <div id="panel"><div id="msg"></div><div id="menu"></div></div>
  <div id="pad">
    <div id="dpad"><button data-d="up">▲</button><button data-d="left">◀</button><div class="c"></div><button data-d="right">▶</button><button data-d="down">▼</button></div>
    <div id="mid"><button id="bStart">START</button></div>
    <div id="ab"><button id="bB">B</button><button id="bA">A</button></div>
  </div>
</div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
